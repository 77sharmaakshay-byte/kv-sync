# Apna model, round dar round (back to back), mahino tak bina haath lagaye. Har 3 ghante: Kaggle par kya haal hai?
#   round khatam -> adapter + state.json Kaggle dataset <user>/nyay-model mein (naya version), nateeja 'data' branch
#                   models/nyay/round-N.json mein, aur turant agla round (data ka agla hissa).
#   data khatam  -> plan (kaggle/train/plan.json) ka agla data (models/nyay/phase); plan khatam to ruko.
#   data abhi Kaggle par nahi bana -> har check par phir dekho.
#   chal raha    -> kuch nahi.
#   GPU nahi mila (hafte ka free GPU khatam) / Kaggle ne purana model diya -> agle check par phir koshish.
#   koi aur galti -> 3 baar turant dobara; phir har 24 ghante dobara, har baar laal (GitHub email karta hai).
# Har run workflow ko 'enable' karta hai: GitHub 60 din bina activity ke schedule band kar deta hai, yeh na ho.
# Kaggle ka free GPU hafte mein ~30 ghante; ek round ~10 ghante, to hafte mein ~3 round.
# Rokna ho to: Actions -> "Kaggle training" -> ... -> Disable workflow.
name: Kaggle training

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'auto = haal dekho / agla round; start = naya round abhi shuru karo'
        type: choice
        options: [auto, start]
        default: auto

permissions:
  contents: write
  actions: write   # workflow ko chalu rakhna (keepalive)

concurrency:
  group: kaggle-train
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL: krishivlaw/nyay-train
      MODEL: krishivlaw/nyay-model
      M: databranch/models/nyay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaggle CLI
        run: pip install --quiet --upgrade kaggle
      - name: Kaggle token
        env:
          SECRET: ${{ secrets.KRISHIVLAW }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = (os.environ.get("SECRET") or "").strip().strip('"').strip("'")
          try:
              d = json.loads(s); env = {"KAGGLE_USERNAME": d["username"], "KAGGLE_KEY": d["key"]}
          except (ValueError, KeyError, TypeError):
              if not s:
                  raise SystemExit("KRISHIVLAW secret khaali hai")
              env = {"KAGGLE_KEY": s} if re.fullmatch(r"[0-9a-f]{32}", s) else {"KAGGLE_API_TOKEN": s}
              env["KAGGLE_USERNAME"] = "krishivlaw"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "KAGGLE_USERNAME":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          PY
      - name: Schedule chalu rakho (60 din wali band-shudgi na ho)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/kaggle-train.yml/enable" || true
      - name: Data branch
        run: |
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:data
          git worktree add databranch data
          mkdir -p "$M"
      - name: Haal aur agla kadam
        id: step
        run: |
          s=$(kaggle kernels status "$KERNEL" 2>&1 | tr 'A-Z' 'a-z' || true); echo "kernel: $s"
          case "$s" in *running*|*queued*) st=running;; *complete*) st=complete;; *error*|*cancel*) st=error;; *) st=none;; esac
          pushed=$(cat "$M/pushed" 2>/dev/null || true)       # jo round Kaggle par bheja, uska number
          done_r=$(cat "$M/done_round" 2>/dev/null || echo 0)  # jis round ka nateeja aa chuka
          phase=$(cat "$M/phase" 2>/dev/null || echo 0)        # plan ka kaunsa data
          plan() { python3 -c "import json,sys;p=json.load(open('kaggle/train/plan.json'))['phases'];i=int(sys.argv[1]);print(p[i][sys.argv[2]] if i<len(p) else '')" "$@"; }
          echo "plan: $phase — $(plan "$phase" naam)"
          next=""
          if [ "${{ inputs.action }}" = "start" ]; then
            [ "$st" = running ] && { echo "Ek round abhi chal raha hai; naya nahi"; exit 0; }
            next=$((done_r + 1)); rm -f "$M/fails"
          elif [ -z "$pushed" ]; then
            echo "Koi round nahi chal raha (shuru karne ke liye: Run workflow -> start)"; exit 0
          elif [ "$st" = running ] || [ "$st" = none ]; then
            echo "Round $pushed: $st"; exit 0
          elif [ "$st" = error ]; then
            mkdir -p out && kaggle kernels output "$KERNEL" -p out --file-pattern '.*\.log' >/dev/null 2>&1 || true
            tail -c 6000 out/*.log 2>/dev/null | tr ',' '\n' | grep '"data"' | tail -40 || true
            n=0; last=0; [ -f "$M/fails" ] && read -r n last < "$M/fails"
            now=$(date +%s)
            if grep -qs "GPU nahi mila" out/*.log; then
              echo "Round $pushed: GPU nahi mila (hafte ka free GPU khatam?) — phir koshish"; next=$pushed
            elif grep -qs "ka adapter chahiye" out/*.log; then   # Kaggle ne model dataset ka naya version abhi nahi diya
              echo "Round $pushed: Kaggle ne pichhle round ka model purana diya — 3 ghante baad phir koshish"; next=$pushed
            elif [ "$n" -lt 3 ]; then
              echo "Round $pushed fail ($((n + 1))/3) — turant dobara"; next=$pushed; echo "$((n + 1)) $now" > "$M/fails"
            elif [ $((now - last)) -ge 86400 ]; then
              echo "Round $pushed baar-baar fail ($n) — roz ek baar dobara; log upar"; next=$pushed
              echo "$((n + 1)) $now" > "$M/fails"; echo "fail=1" >> "$GITHUB_OUTPUT"
            else
              echo "Round $pushed fail ($n baar); agli koshish $(date -d @$((last + 86400)) '+%d-%m %H:%M') UTC ke baad"; exit 0
            fi
          else  # complete
            mkdir -p out && kaggle kernels output "$KERNEL" -p out
            st_file=$(find out -name state.json | head -1)
            r=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['round'])" "$st_file" 2>/dev/null || echo 0)
            if [ "$r" = "$pushed" ] && [ "$r" -gt "$done_r" ]; then
              a=$(dirname "$st_file"); mkdir -p up && cp "$a"/adapter_config.json "$a"/adapter_model.safetensors "$a"/state.json up/
              echo "{\"title\": \"nyay-model\", \"id\": \"$MODEL\", \"licenses\": [{\"name\": \"other\"}]}" > up/dataset-metadata.json
              ls -la up
              if kaggle datasets status "$MODEL" >/dev/null 2>&1; then
                kaggle datasets version -p up -m "round $r"
              else
                kaggle datasets create -p up
              fi
              for i in $(seq 1 40); do kaggle datasets status "$MODEL" 2>&1 | grep -qi ready && break; sleep 30; done
              # 'ready' ke baad bhi Kaggle kuch der purana version deta hai (round 8 isi se ruka): naya state.json dikhe tab aage
              for i in $(seq 1 30); do
                rm -rf chk && mkdir chk && kaggle datasets download "$MODEL" -f state.json -p chk >/dev/null 2>&1 || true
                for z in chk/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d chk; done
                python3 -c "import json,sys;sys.exit(json.load(open('chk/state.json'))['round']!=int(sys.argv[1]))" "$r" 2>/dev/null && { echo "naya model Kaggle par dikh raha (round $r)"; break; }
                sleep 60
              done
              sleep 120
              cp "$(find out -name eval.json | head -1)" "$M/round-$r.json"
              python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print({k:d[k] for k in d if k!='samples'})" "$M/round-$r.json"
              echo "$r" > "$M/done_round"; done_r=$r; rm -f "$M/fails"; echo "app=1" >> "$GITHUB_OUTPUT"
            fi
            if [ "$done_r" -ge "$pushed" ]; then
              left=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d['total']-d['offset'])" "$st_file" 2>/dev/null || echo 1)
              same=$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1])).get('data','krishivlaw/nyay-train-v1')==sys.argv[2]))" "$st_file" "$(plan "$phase" data)" 2>/dev/null || echo 0)
              if [ "$same" = 1 ] && [ "$left" -le 0 ]; then
                phase=$((phase + 1)); echo "$phase" > "$M/phase"
                if [ -n "$(plan "$phase" data)" ]; then echo "Data khatam — plan ka agla: $(plan "$phase" naam)"; next=$((done_r + 1))
                else echo "Poora plan sikhaya ja chuka"; rm -f "$M/pushed"; fi
              else
                next=$((done_r + 1))
              fi
            else
              echo "Kaggle par round $pushed ka nateeja nahi mila (mila round $r) — dobara bhejo"; next=$pushed
            fi
          fi
          DATA=$(plan "$phase" data); LR=$(plan "$phase" lr)
          if [ -n "$next" ] && ! kaggle datasets status "$DATA" 2>&1 | grep -qi ready; then
            echo "Round $next ka data $DATA abhi Kaggle par taiyaar nahi — agle check par phir dekhenge"
            echo "$next" > "$M/pushed"; next=""
          fi
          if [ -n "$next" ]; then
            mkdir -p kt
            python3 - "$next" "$DATA" "$LR" <<'PY'
          import base64, sys
          src = open("kaggle/train/launch.py").read()
          w = base64.b64encode(open("kaggle/train/train_nyay.py", "rb").read()).decode()
          for k, v in (("__WORKER_B64__", w), ("__ROUND__", sys.argv[1]), ("__DATA__", sys.argv[2]), ("__LR__", sys.argv[3])):
              src = src.replace(k, v)
          open("kt/launch.py", "w").write(src)
          PY
            src="\"$DATA\""; [ "$next" -gt 1 ] && src="$src, \"$MODEL\""
            cat > kt/kernel-metadata.json <<META
          {"id": "$KERNEL", "title": "nyay-train", "code_file": "launch.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": [$src], "competition_sources": [], "kernel_sources": []}
          META
            kaggle kernels push -p kt
            echo "$next" > "$M/pushed"; rm -f "$M/failed"
            echo "Round $next Kaggle par shuru ($DATA, lr $LR)"; echo "app=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Data branch par save
        if: always()
        run: |
          cd databranch
          git add models
          git diff --cached --quiet || git commit -qm "nyay model: $(TZ=Asia/Kolkata date '+%d-%m-%Y %H:%M')"
          git push -q origin data || { git pull -q --rebase origin data && git push -q origin data; }  # doosre workflow ne beech mein push kiya ho
      - name: App mein naya haal (Main > Apna model)
        if: steps.step.outputs.app == '1'
        run: sh scripts/publish_site.sh databranch || echo "Site abhi update nahi hui; agle court data ke saath ho jayegi"
      - name: Round fail
        if: steps.step.outputs.fail == '1'
        run: |
          echo "Training round baar-baar fail (log upar). Roz apne aap dobara koshish hogi; theek karke: Run workflow -> start"; exit 1
