# Ek vishay (upvishay) ke saare cases ki list database se: data branch ke lists/<vishay>.csv aur .md mein.
# Actions > "Vishay ki list" > Run workflow > upvishay (jaisa khoj mein: Compassionate appointment).
# Har case: parties, pehla/aakhri order, database mein kitni tareekhon ke order, disposal, nateeja (machine ka).
name: Vishay ki list

on:
  workflow_dispatch:
    inputs:
      upvishay:
        description: 'Upvishay (jaisa khoj mein)'
        default: 'Compassionate appointment'
      court:
        description: 'Court'
        type: choice
        options: [UKHC, SC, Dono]
        default: UKHC

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      DATASET: krishivlaw/sc-data-set
    steps:
      - name: Disk khaali karo (database ~9 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kaggle CLI
        run: pip install --quiet kaggle six
      - name: Kaggle token
        env:
          SECRET: ${{ secrets.KRISHIVLAW }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = (os.environ.get("SECRET") or "").strip().strip('"').strip("'")
          try:
              d = json.loads(s); env = {"KAGGLE_USERNAME": d["username"], "KAGGLE_KEY": d["key"]}
          except (ValueError, KeyError, TypeError):
              if not s:
                  raise SystemExit("KRISHIVLAW secret khaali hai")
              env = {"KAGGLE_KEY": s} if re.fullmatch(r"[0-9a-f]{32}", s) else {"KAGGLE_API_TOKEN": s}
              env["KAGGLE_USERNAME"] = "krishivlaw"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "KAGGLE_USERNAME":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          PY
      - name: Kaggle se database
        run: |
          mkdir -p "$RUNNER_TEMP/db" && cd "$RUNNER_TEMP/db"
          kaggle datasets download "$DATASET" -f krishivlaw.db -p . || kaggle datasets download "$DATASET" -p .
          for z in *.zip; do [ -f "$z" ] && unzip -q "$z" && rm "$z"; done
          g=$(ls -S *.gz 2>/dev/null | head -1 || true)
          [ -n "$g" ] && gunzip -c "$g" > krishivlaw.db.tmp && rm "$g" && mv krishivlaw.db.tmp krishivlaw.db
          [ -f krishivlaw.db ] || { d=$(ls -S *.db *.sqlite 2>/dev/null | head -1 || true); [ -n "$d" ] && mv "$d" krishivlaw.db; }
          test -f krishivlaw.db
      - name: List banao
        env:
          UPVISHAY: ${{ inputs.upvishay }}
          COURT: ${{ inputs.court }}
        run: |
          c=(); [ "$COURT" != "Dono" ] && c=(--court "$COURT")
          python scripts/export_vishay.py --db "$RUNNER_TEMP/db/krishivlaw.db" --upvishay "$UPVISHAY" "${c[@]}" --out "$RUNNER_TEMP/lists"
          cat "$RUNNER_TEMP"/lists/*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Data branch par save
        run: |
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:data
          git worktree add databranch data
          mkdir -p databranch/lists && cp "$RUNNER_TEMP"/lists/* databranch/lists/
          cd databranch && git add lists
          git diff --cached --quiet || git commit -qm "Vishay ki list: ${{ inputs.upvishay }}"
          git push -q origin data || { git pull -q --rebase origin data && git push -q origin data; }
