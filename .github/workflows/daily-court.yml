# Roz ka court data — GitHub apne aap chalata hai (India time 06:03, 08:03, 10:03 aur shaam 5:33 se 9:33 har aadhe
# ghante; GitHub ka schedule kabhi-kabhi chhod deta hai, isliye zyada baar). Mac ki zaroorat nahi (eCourts).
# 1. Nainital HC ki cause list: subah aaj ki, aur har run mein aage ke 3 court din ki (court pehle daal deta hai).
#    Jis run mein mil gayi, us tareekh ke baaki runs kuch nahi karte; mil te hi app (site) par.
# 2. Scraper (SC latest + Nainital HC ke naye disposed cases): din mein ek hi baar, subah.
# Nateeja: 'data' branch (cause list ka text, state) + Releases (PDFs ki tar.gz).
# Haath se chalana: Actions tab → "Roz ka court data" → Run workflow.
name: Roz ka court data

on:
  schedule:
    - cron: '33 0 * * *'   # 06:03 IST
    - cron: '33 2 * * *'   # 08:03 IST
    - cron: '33 4 * * *'   # 10:03 IST
    - cron: '3,33 12-15 * * *'  # 17:33-21:03 IST har aadha ghanta — agle din ki list (aur badli hui)
    - cron: '3 16 * * *'        # 21:33 IST
  workflow_dispatch:
    inputs:
      date:
        description: 'Tareekh DD-MM-YYYY (khaali = aaj)'
        required: false
      force:
        description: 'Pehle ho chuka ho to bhi dobara'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-court   # Kaggle database update (ghanta bhar) ke peeche na ruke
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Data branch kholo
        run: |
          echo "WORK=$RUNNER_TEMP/kl" >> "$GITHUB_ENV"
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:data
            git worktree add databranch data
          else
            git worktree add --orphan -b data databranch
          fi
          mkdir -p databranch/causelist databranch/state

      - name: Aaj kya baaki hai
        id: todo
        run: |
          # Kaunsi tareekhon ki list laani hai: subah aaj ki, aur hamesha aage ke 3 court din (Ravivaar chhod ke);
          # court aksar 2-3 din pehle daal deta hai. Pehle aa chuki list us din subah ek baar dobara (badlav ke liye).
          TODAY=$(TZ=Asia/Kolkata date +%d-%m-%Y); H=$(TZ=Asia/Kolkata date +%H)
          FORCE="${{ inputs.force }}"
          if [ -n "${{ inputs.date }}" ]; then
            DATES="${{ inputs.date }}"
          else
            DATES=""; [ "$H" -lt 15 ] && DATES="$TODAY"
            n=0; i=1
            while [ $n -lt 3 ]; do
              if [ "$(TZ=Asia/Kolkata date -d "+$i day" +%u)" != 7 ]; then
                DATES="$DATES $(TZ=Asia/Kolkata date -d "+$i day" +%d-%m-%Y)"; n=$((n + 1))
              fi
              i=$((i + 1))
            done
          fi
          TODO=""; NEXT=""
          for d in $DATES; do
            [ "$d" != "$TODAY" ] && [ -z "$NEXT" ] && NEXT=$d   # agla court din
            f="databranch/causelist/$d/index.json"
            if [ "$FORCE" = "true" ] || [ ! -f "$f" ]; then
              TODO="$TODO $d"
            elif [ "$d" = "$NEXT" ] && [ "$H" -ge 16 ]; then   # shaam ko kal ki list har baar dobara (court badalta hai)
              TODO="$TODO $d:dobara"
            elif [ "$d" = "$TODAY" ] && [ "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("fetched",""))' "$f")" != "$TODAY" ]; then
              TODO="$TODO $d:dobara"
            fi
          done
          TODO=$(echo $TODO)
          SCRAPE=no
          if [ -z "${{ inputs.date }}" ] && [ "$H" -lt 15 ]; then
            SCRAPE=yes; [ "$FORCE" != "true" ] && [ "$(cat databranch/state/last_scrape 2>/dev/null)" = "$TODAY" ] && SCRAPE=no
          fi
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          echo "dates=$TODO" >> "$GITHUB_OUTPUT"
          echo "causelist=$([ -n "$TODO" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "scrape=$SCRAPE" >> "$GITHUB_OUTPUT"
          echo "dekhi: $DATES | laani: ${TODO:-koi nahi} | scraper: $SCRAPE"

      - uses: actions/setup-python@v5
        if: steps.todo.outputs.causelist == 'yes' || steps.todo.outputs.scrape == 'yes'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vendor/product/bharat-courts/pyproject.toml

      - name: bharat-courts install
        if: steps.todo.outputs.causelist == 'yes' || steps.todo.outputs.scrape == 'yes'
        run: pip install -q "./vendor/product/bharat-courts[ocr]" pypdfium2

      - name: Cause list
        id: cl
        if: steps.todo.outputs.causelist == 'yes'
        continue-on-error: true
        run: |
          # eCourts Oct 2026 se GitHub ko jawab nahi deta (har tareekh 6 minute timeout); tab chhodo, taaki court ki
          # site wali list (India server / Mac, mac-causelist.yml) is workflow ke peeche line mein na ruke
          curl -sS -o /dev/null -m 25 https://hcservices.ecourts.gov.in/hcservices/main.php \
            || { echo "eCourts GitHub se nahi khula — aaj chhod rahe (court ki site wala raasta chalu)"; exit 0; }
          bad=0
          for item in ${{ steps.todo.outputs.dates }}; do
            DATE=${item%%:*}; F=""
            [ "$item" != "$DATE" ] || [ "${{ inputs.force }}" = "true" ] && F=--force
            set +e
            python scripts/fetch_live.py --data "$WORK" uk-causelist --date "$DATE" --out "$WORK/causelist" $F
            rc=$?
            set -e
            if [ $rc -eq 4 ]; then echo "$DATE: list abhi nahi aayi — agle run mein dobara"; continue; fi
            if [ $rc -ne 0 ]; then echo "$DATE: galti ($rc)"; bad=1; continue; fi
            # Branch mein sirf text + index (chhota); PDFs Release mein. Dobara laayi to purani hata do.
            # dobara laayi to purani eCourts files hatao; court ki site wali (ehcr-*) rehne do
            mkdir -p "databranch/causelist/$DATE" && find "databranch/causelist/$DATE" -type f ! -name 'ehcr-*' ! -name 'index-ehcr.json' -delete
            cp "$WORK/causelist/$DATE"/*.txt "$WORK/causelist/$DATE/index.json" "databranch/causelist/$DATE/"
            tar -czf "$WORK/causelist-$DATE.tar.gz" -C "$WORK/causelist" "$DATE"
            TAG="causelist-${DATE:6:4}-${DATE:3:2}"   # mahine ki ek release, har din ek file
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Cause list ${DATE:3:7}" \
              --notes "Nainital HC ki roz ki cause list PDFs (har din ek tar.gz)" --latest=false
            gh release upload "$TAG" "$WORK/causelist-$DATE.tar.gz" --clobber
          done
          exit $bad

      - name: Scraper (SC latest + Nainital HC naye disposed cases)
        id: scrape
        if: steps.todo.outputs.scrape == 'yes'
        continue-on-error: true
        run: |
          DATE=${{ steps.todo.outputs.date }}
          YEAR=$(TZ=Asia/Kolkata date +%Y)
          python scripts/fetch_live.py --data "$WORK" sc-latest || true
          python scripts/fetch_live.py --data "$WORK" uk-gap --only-missing \
            --known-file databranch/state/known_ukhc_cnrs.txt.gz --done-file databranch/state/done_ukhc_cnrs.txt \
            --years "$((YEAR-1))-$YEAR" --refresh-lists --rotate --max-minutes 30 || true
          if [ -d "$WORK/live" ] && [ -n "$(find "$WORK/live" -name '*.pdf' -print -quit)" ]; then
            tar -czf "$WORK/live-$DATE.tar.gz" --exclude='_gap' -C "$WORK" live
            TAG="live-${DATE:6:4}-${DATE:3:2}"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Naye orders ${DATE:3:7}" \
              --notes "Court se laaye naye judgments/orders (har din ek tar.gz). Mac par kholo: ~/krishivlaw-data mein, phir build_db.py --live" --latest=false
            gh release upload "$TAG" "$WORK/live-$DATE.tar.gz" --clobber
          fi
          echo "$DATE" > databranch/state/last_scrape

      - name: Data branch par save
        if: always()
        run: |
          cd databranch
          git add -A
          if git diff --cached --quiet; then echo "Kuch naya nahi"; exit 0; fi
          git commit -q -m "court data ${{ steps.todo.outputs.date }}"
          git push -q origin data || { git pull -q --rebase origin data && git push -q origin data; }  # doosre workflow ne beech mein push kiya ho

      - name: App site update
        if: always()
        run: sh scripts/publish_site.sh databranch
