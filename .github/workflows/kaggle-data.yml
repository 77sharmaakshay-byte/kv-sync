# Training ke daur ka data banao aur private Kaggle dataset mein bhejo (plan: kaggle/train/plan.json).
#   padhai-sc : SC ke saare faisle, poore, bade bench se chhote (scripts/build_padhai.py) -> krishivlaw/nyay-padhai-sc
#   kaam      : shreni/vishay/mudda/nateeja (Nainital HC + SC) + headnote dohrana (build_train_hc.py) -> nyay-kaam-v2
#   padhai-hc : Nainital HC ke saare faisle, Division Bench pehle -> krishivlaw/nyay-padhai-hc
# "Kaggle training" data taiyaar hote hi apne aap us daur par chalta hai. Database: Kaggle ka krishivlaw/sc-data-set.
name: Training data banao

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Kaunsa data'
        type: choice
        options: [sab, padhai-sc, kaam, padhai-hc]
        default: sab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      DATASET: krishivlaw/sc-data-set
      WHICH: ${{ inputs.which }}
    steps:
      - name: Disk khaali karo (database ~9 GB + data)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet kaggle
      - name: Kaggle token
        env:
          SECRET: ${{ secrets.KRISHIVLAW }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = (os.environ.get("SECRET") or "").strip().strip('"').strip("'")
          try:
              d = json.loads(s); env = {"KAGGLE_USERNAME": d["username"], "KAGGLE_KEY": d["key"]}
          except (ValueError, KeyError, TypeError):
              if not s:
                  raise SystemExit("KRISHIVLAW secret khaali hai")
              env = {"KAGGLE_KEY": s} if re.fullmatch(r"[0-9a-f]{32}", s) else {"KAGGLE_API_TOKEN": s}
              env["KAGGLE_USERNAME"] = "krishivlaw"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "KAGGLE_USERNAME":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          PY
      - name: v1 data (jaanch ke wahi 1000 headnote faisle)
        run: |
          git fetch --depth 1 origin train-data
          V=$RUNNER_TEMP/v1 && mkdir -p $V && git archive origin/train-data | tar -x -C $V
          cd $V && cat train.jsonl.gz.part-* > train.jsonl.gz && rm train.jsonl.gz.part-* && sha256sum -c SHA256SUMS
          echo "V1=$V" >> "$GITHUB_ENV"
      - name: Kaggle se database
        run: |
          W=$RUNNER_TEMP/db && mkdir -p $W && cd $W
          kaggle datasets download "$DATASET" -f krishivlaw.db -p . || kaggle datasets download "$DATASET" -p .
          for z in *.zip; do [ -f "$z" ] && unzip -q "$z" && rm "$z"; done
          g=$(ls -S *.gz 2>/dev/null | head -1 || true)
          [ -n "$g" ] && gunzip -c "$g" > krishivlaw.db.tmp && rm "$g" && mv krishivlaw.db.tmp krishivlaw.db
          [ -f krishivlaw.db ] || { d=$(ls -S *.db 2>/dev/null | head -1 || true); [ -n "$d" ] && mv "$d" krishivlaw.db; }
          test -f krishivlaw.db && ls -la && df -h .
          echo "DB=$W/krishivlaw.db" >> "$GITHUB_ENV"
          sqlite3 krishivlaw.db "SELECT court, coalesce(bench_size, '?'), count(*) FROM judgments GROUP BY 1, 2 ORDER BY 1, 2;"
      - name: Banao aur Kaggle par bhejo
        run: |
          up() {   # $1 = folder, $2 = dataset ka naam
            echo "{\"title\": \"$2\", \"id\": \"krishivlaw/$2\", \"licenses\": [{\"name\": \"other\"}]}" > "$1/dataset-metadata.json"
            du -sh "$1"; ls "$1" | head -5; ls "$1" | wc -l
            if kaggle datasets status "krishivlaw/$2" >/dev/null 2>&1; then
              kaggle datasets version -p "$1" -m "$(date +%d-%m-%Y)" --dir-mode skip
            else
              kaggle datasets create -p "$1" --dir-mode skip   # private (public tabhi jab -u)
            fi
            rm -rf "$1"
          }
          O=$RUNNER_TEMP/out
          if [ "$WHICH" = sab ] || [ "$WHICH" = padhai-sc ]; then
            python scripts/build_padhai.py --db "$DB" --court SC --out $O/psc --v1 "$V1" && up $O/psc nyay-padhai-sc
          fi
          if [ "$WHICH" = sab ] || [ "$WHICH" = kaam ]; then
            python scripts/build_train_hc.py --db "$DB" --out $O/kaam --v1 "$V1" && cat $O/kaam/stats.json && up $O/kaam nyay-kaam-v2
          fi
          if [ "$WHICH" = sab ] || [ "$WHICH" = padhai-hc ]; then
            python scripts/build_padhai.py --db "$DB" --court UKHC --out $O/phc --v1 "$V1" && up $O/phc nyay-padhai-hc
          fi
