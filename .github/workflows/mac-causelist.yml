# Nainital HC ki apni cause list site (ehcr.uk.gov.in): court kal ki list aaj shaam (~5 baje) yahin daalta hai,
# eCourts par baad mein. Site sirf India se khulti hai, isliye PDF laata hai India server (Vercel, Mumbai —
# relay/, india-server.yml; Mac ki zaroorat nahi), woh na ho ya na chale to aapka Mac (self-hosted runner 'mac').
# Text nikaalna, data branch aur app (site) GitHub par. Mac jaaga ho to uska timer (6/7/8 baje) bhi 'inbox' ke
# saath yahi chalata hai — GitHub ka schedule kabhi ghanton der se chalta hai, isliye shaam ko har aadha ghanta.
# Badli hui list (court ne naya PDF ya naya time daala) aate hi us din ki list app mein badal jaati hai.
name: Mac cause list (ehcr)

on:
  schedule:
    - cron: '3 1 * * *'              # 06:33 IST — aaj ki (aakhri badlav)
    - cron: '3,33 11-16 * * *'       # 16:33-22:03 IST, har aadha ghanta — kal ki list (aur badli hui)
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = list laao aur app par; probe = site ka format dekho'
        type: choice
        options: [fetch, probe]
        default: fetch
      inbox:
        description: 'India server / Mac timer ki file, Release ehcr-inbox mein (khaali = India server, warna Mac runner se laao)'
        default: ''

permissions:
  contents: write
  actions: write   # Mac timer ki file na mile to Mac runner wala run

jobs:
  india:
    # India server (Vercel, Mumbai) court ki site se PDFs laa kar lautata hai; yahan se 'ehcr' artifact
    if: (inputs.inbox == '' || inputs.inbox == null) && inputs.mode != 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ok: ${{ steps.call.outputs.ok }}
    steps:
      - name: India server (Vercel, Mumbai) se list
        id: call
        env:
          T: ${{ secrets.VERCEL_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ok=0" >> "$GITHUB_OUTPUT"
          URL=$(gh api "repos/${{ github.repository }}/contents/state/india_url?ref=data" -H "Accept: application/vnd.github.raw" 2>/dev/null) || URL=""
          case "$URL" in https://*) ;; *) echo "India server laga nahi (India server lagao) — Mac wala raasta"; exit 0;; esac
          [ -n "$T" ] || { echo "VERCEL_TOKEN nahi — Mac wala raasta"; exit 0; }
          KEY=$(printf 'nyay-india:%s' "$T" | sha256sum | cut -c1-40); echo "::add-mask::$KEY"
          code=$(curl -sS -m 320 -o ehcr.tar.gz -D h.txt -w '%{http_code}' -H "Authorization: Bearer $KEY" "$URL/api/causelist" || true)
          if [ "$code" != 200 ] || ! mkdir -p ehcr || ! tar -xzf ehcr.tar.gz -C ehcr; then
            echo "India server se nahi aayi ($code): $(head -c 400 ehcr.tar.gz 2>/dev/null) — Mac wala raasta"; exit 0
          fi
          grep -i '^x-days' h.txt || true; ls -R ehcr | head -40
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.call.outputs.ok == '1'
        with:
          name: ehcr
          path: ehcr
          if-no-files-found: ignore
          retention-days: 3

  ehcr:
    needs: india
    if: ${{ !cancelled() && (inputs.inbox == '' || inputs.inbox == null) && (inputs.mode == 'probe' || needs.india.outputs.ok != '1') }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    concurrency:
      group: mac-ehcr   # Mac soya ho to line mein sirf ek (har aadhe ghante wale runs jama na hon)
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Mac timer ki files taaza (laga ho to)
        run: |
          D="$HOME/nyay-search/timer"
          [ -f "$D/gh_token" ] || exit 0
          cp scripts/ukhc_ehcr.py scripts/mac_ehcr_timer.sh "$D/" && printf '%s' "${{ github.repository }}" > "$D/repo"
      - name: Site ka format
        if: inputs.mode == 'probe'
        run: python3 scripts/ukhc_ehcr.py --probe
      - name: List PDFs laao
        if: inputs.mode != 'probe'
        run: |
          rm -rf ehcr && python3 scripts/ukhc_ehcr.py fetch --out ehcr
          mkdir -p ehcr && ls -R ehcr | head -40
      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'probe'
        with:
          name: ehcr
          path: ehcr
          if-no-files-found: ignore
          retention-days: 3

  publish:
    needs: [india, ehcr]
    # Mac timer wali file ho to Mac runner ki zaroorat nahi (ehcr job skip hota hai)
    if: ${{ !cancelled() && inputs.mode != 'probe' && (needs.ehcr.result == 'success' || needs.india.outputs.ok == '1' || inputs.inbox != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-court   # data branch par eCourts wale workflow ke saath ek hi waqt mein nahi
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.inbox == '' || inputs.inbox == null
        continue-on-error: true   # Mac ko kuch nahi mila to artifact nahi hota
        with:
          name: ehcr
          path: ehcr
      - name: Mac timer ki file (Release ehcr-inbox)
        if: inputs.inbox != '' && inputs.inbox != null
        env:
          INBOX: ${{ inputs.inbox }}
        run: |
          case "$INBOX" in ehcr-[0-9]*-[0-9]*.tar.gz) ;; *) echo "galat naam: $INBOX"; exit 1;; esac
          if ! gh release download ehcr-inbox -p "$INBOX" -D .; then
            echo "Mac timer ki file nahi pahunchi — Mac runner se seedhe list mangwa rahe hain"
            gh workflow run mac-causelist.yml --ref main
            mkdir -p ehcr; exit 0
          fi
          mkdir -p ehcr && tar -xzf "$INBOX" -C ehcr && rm "$INBOX"
          gh release delete-asset ehcr-inbox "$INBOX" -y || true
          ls ehcr
      - name: Kuch mila?
        id: got
        run: echo "n=$(find ehcr -name ehcr.json 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.got.outputs.n != '0'
        with:
          python-version: '3.12'
      - name: PDF se text, court-wise
        if: steps.got.outputs.n != '0'
        run: |
          pip install -q pypdfium2
          python scripts/ukhc_ehcr.py split --dir ehcr
      - name: Data branch mein (sirf nayi / badli hui list)
        if: steps.got.outputs.n != '0'
        id: save
        run: |
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:data && git worktree add databranch data
          changed=0
          for d in ehcr/*/; do
            DATE=$(basename "$d"); dst="databranch/causelist/$DATE"
            new_up=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["uploads"])' "$d/index-ehcr.json")
            old_up=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("uploads"))' "$dst/index-ehcr.json" 2>/dev/null || echo none)
            if [ "$new_up" = "$old_up" ]; then echo "$DATE: koi badlav nahi"; continue; fi
            echo "$DATE: nayi/badli list — $new_up"
            # sirf pichhli ehcr files hatao; eCourts wali (index.json, civil-*/criminal-*) rehne do
            mkdir -p "$dst" && rm -f "$dst"/ehcr-*.txt "$dst/index-ehcr.json"
            cp "$d"/ehcr-*.txt "$d/index-ehcr.json" "$dst/"
            tar -czf "ehcr-$DATE.tar.gz" -C ehcr "$DATE"
            TAG="causelist-${DATE:6:4}-${DATE:3:2}"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Cause list ${DATE:3:7}" \
              --notes "Nainital HC ki roz ki cause list PDFs (har din ek tar.gz)" --latest=false
            gh release upload "$TAG" "ehcr-$DATE.tar.gz" --clobber
            changed=1
          done
          cd databranch
          git add -A
          git diff --cached --quiet || git commit -qm "cause list (ehcr) $(TZ=Asia/Kolkata date '+%d-%m-%Y %H:%M')"
          git push -q origin data || { git pull -q --rebase origin data && git push -q origin data; }
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: App site update
        if: steps.save.outputs.changed == '1'
        run: sh scripts/publish_site.sh databranch
