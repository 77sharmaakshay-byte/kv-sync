# Ek jagah sab: Kaggle ka private dataset krishivlaw/sc-data-set (SC + Nainital HC) hi asli database hai.
# Har hafte (aur haath se bhi): Kaggle se database lo, roz ke scraper wale naye orders
# (Releases 'live-YYYY-MM' ki tar.gz: Nainital HC + Supreme Court) jodo, naya version Kaggle par.
# Kaunsi tar jud chuki, woh 'data' branch ki state/kaggle_synced.txt mein; dobara nahi judti.
# Saath mein state/known_ukhc_cnrs.txt.gz bhi database se taaza, taaki scraper wahi case dobara na laaye.
name: Kaggle database update

on:
  schedule:
    - cron: '47 20 * * 6'   # Ravivaar subah 02:17 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      DATASET: krishivlaw/sc-data-set
    steps:
      - name: Disk khaali karo (database ~9 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Python packages
        run: pip install --quiet -r requirements.txt kaggle
      - name: Kaggle token
        env:
          SECRET: ${{ secrets.KRISHIVLAW }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = (os.environ.get("SECRET") or "").strip().strip('"').strip("'")
          try:
              d = json.loads(s); env = {"KAGGLE_USERNAME": d["username"], "KAGGLE_KEY": d["key"]}
          except (ValueError, KeyError, TypeError):
              if not s:
                  raise SystemExit("KRISHIVLAW secret khaali hai")
              env = {"KAGGLE_KEY": s} if re.fullmatch(r"[0-9a-f]{32}", s) else {"KAGGLE_API_TOKEN": s}
              env["KAGGLE_USERNAME"] = "krishivlaw"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "KAGGLE_USERNAME":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          PY
      - name: Data branch
        run: |
          echo "W=$RUNNER_TEMP/kdb" >> "$GITHUB_ENV"
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:data
          git worktree add databranch data
          mkdir -p databranch/state && touch databranch/state/kaggle_synced.txt
      - name: Naye orders (Releases) jo abhi database mein nahi
        id: new
        run: |
          mkdir -p "$W/data" "$W/dl"
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("live-")) | .tag_name as $t | .assets[] | "\($t) \(.name)"' \
            | sort > "$W/all.txt"
          sort databranch/state/kaggle_synced.txt > "$W/done.txt"
          comm -23 "$W/all.txt" "$W/done.txt" > "$W/todo.txt"
          echo "naye: $(wc -l < "$W/todo.txt")"; cat "$W/todo.txt"
          while read -r tag name; do
            gh release download "$tag" -p "$name" -D "$W/dl" --clobber
            tar -xzf "$W/dl/$name" -C "$W/data" && rm "$W/dl/$name"
          done < "$W/todo.txt"
          echo "count=$(wc -l < "$W/todo.txt")" >> "$GITHUB_OUTPUT"
      - name: Kaggle se database
        if: steps.new.outputs.count != '0'
        run: |
          mkdir -p "$W/db"
          # pura-dataset zip Kaggle der se banata hai (404); seedha database file lo
          kaggle datasets download "$DATASET" -f krishivlaw.db -p "$W/db" \
            || kaggle datasets download "$DATASET" -p "$W/db"
          cd "$W/db" && ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -q "$z" && rm "$z"; done
          # naam kuch bhi ho: pehli .db.gz / .gz ya .db file lo
          g=$(ls -S *.gz 2>/dev/null | head -1 || true)
          [ -n "$g" ] && gunzip -c "$g" > krishivlaw.db.tmp && rm "$g" && mv krishivlaw.db.tmp krishivlaw.db
          [ -f krishivlaw.db ] || { d=$(ls -S *.db *.sqlite 2>/dev/null | head -1 || true); [ -n "$d" ] && mv "$d" krishivlaw.db; }
          test -f krishivlaw.db || { echo "database file nahi mili"; ls -la; exit 1; }
          sqlite3 krishivlaw.db "PRAGMA quick_check;" | head -3
          sqlite3 krishivlaw.db "SELECT court, count(*) FROM judgments GROUP BY court;"
      - name: Naye orders database mein
        if: steps.new.outputs.count != '0'
        run: |
          python scripts/build_db.py --data "$W/data" --db "$W/db/krishivlaw.db" --live || true
          sqlite3 "$W/db/krishivlaw.db" "SELECT court, count(*) FROM judgments GROUP BY court;"
          sqlite3 "$W/db/krishivlaw.db" "SELECT DISTINCT cnr FROM judgments WHERE court='UKHC' AND cnr IS NOT NULL;" \
            | gzip -9 > databranch/state/known_ukhc_cnrs.txt.gz
          echo "known CNR: $(zcat databranch/state/known_ukhc_cnrs.txt.gz | wc -l)"
      - name: Naya version Kaggle par
        if: steps.new.outputs.count != '0'
        run: |
          mkdir -p "$W/up"
          sqlite3 "$W/db/krishivlaw.db" "PRAGMA wal_checkpoint(TRUNCATE);" >/dev/null
          gzip -1 -c "$W/db/krishivlaw.db" > "$W/up/krishivlaw.db.gz" && rm "$W/db/krishivlaw.db"
          echo "{\"title\": \"sc data set\", \"id\": \"$DATASET\", \"licenses\": [{\"name\": \"other\"}]}" > "$W/up/dataset-metadata.json"
          ls -la "$W/up"
          kaggle datasets version -p "$W/up" -m "update $(TZ=Asia/Kolkata date +%d-%m-%Y): $(wc -l < "$W/todo.txt") nayi tar"
          cat "$W/todo.txt" >> databranch/state/kaggle_synced.txt
      - name: Data branch par save
        if: steps.new.outputs.count != '0'
        run: |
          cd databranch
          git add state
          git diff --cached --quiet || git commit -qm "Kaggle database update $(TZ=Asia/Kolkata date +%d-%m-%Y)"
          git push -q origin data
