# Keyword search (Indian Kanoon jaisa) ka server Hugging Face par: Kaggle wala database aapke private HF dataset
# (<user>/nyay-db) mein, aur search server Space (<user>/nyay-search, space/ folder) mein. Har "Kaggle database update"
# ke baad apne aap (naye faisle search mein), aur haath se bhi. Space ka link data branch state/search_url mein ->
# app (build_app_data.py: data/search.json). Pehle khoje gaye shabdon ki ginti state/search_terms.json mein.
# Zaroori: GitHub secret HF_TOKEN (Hugging Face token, 'Write').
name: HF search server

on:
  workflow_run:
    workflows: ['Kaggle database update']
    types: [completed]
  workflow_dispatch:
    inputs:
      db:
        description: 'Database bhi dobara bhejo (sirf server code badla ho to false)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hf-search
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      DATASET: krishivlaw/sc-data-set
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SEND_DB: ${{ github.event_name == 'workflow_run' || inputs.db }}
    steps:
      - name: Disk khaali karo (database ~3 GB gz)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet kaggle "huggingface_hub>=0.26"
      - name: HF token hai?
        run: '[ -n "$HF_TOKEN" ] || { echo "GitHub secret HF_TOKEN nahi hai (Settings > Secrets > Actions)"; exit 1; }'
      - name: Kaggle token
        if: env.SEND_DB == 'true'
        env:
          SECRET: ${{ secrets.KRISHIVLAW }}
        run: |
          python3 - <<'PY'
          import json, os, re
          s = (os.environ.get("SECRET") or "").strip().strip('"').strip("'")
          try:
              d = json.loads(s); env = {"KAGGLE_USERNAME": d["username"], "KAGGLE_KEY": d["key"]}
          except (ValueError, KeyError, TypeError):
              if not s:
                  raise SystemExit("KRISHIVLAW secret khaali hai")
              env = {"KAGGLE_KEY": s} if re.fullmatch(r"[0-9a-f]{32}", s) else {"KAGGLE_API_TOKEN": s}
              env["KAGGLE_USERNAME"] = "krishivlaw"
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "KAGGLE_USERNAME":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}\n")
          PY
      - name: Kaggle se database (.gz)
        if: env.SEND_DB == 'true'
        run: |
          W=$RUNNER_TEMP/db && mkdir -p $W && cd $W
          kaggle datasets download "$DATASET" -f krishivlaw.db.gz -p . || kaggle datasets download "$DATASET" -p .
          for z in *.zip; do [ -f "$z" ] && unzip -q "$z" && rm "$z"; done
          if [ ! -f krishivlaw.db.gz ]; then
            d=$(ls -S *.db 2>/dev/null | head -1 || true); g=$(ls -S *.gz 2>/dev/null | head -1 || true)
            if [ -n "$g" ]; then mv "$g" krishivlaw.db.gz; elif [ -n "$d" ]; then gzip -1 -c "$d" > krishivlaw.db.gz && rm "$d"; fi
          fi
          ls -la; test -f krishivlaw.db.gz
          echo "GZ=$W/krishivlaw.db.gz" >> "$GITHUB_ENV"
      - name: Data branch
        run: |
          git config --global user.name "krishivlaw-bot"
          git config --global user.email "krishivlaw-bot@users.noreply.github.com"
          git fetch --depth 1 origin data:data
          git worktree add databranch data
      - name: Hugging Face par database + server
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from collections import Counter
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          user = api.whoami()["name"]
          ds, sp = f"{user}/nyay-db", f"{user}/nyay-search"
          api.create_repo(ds, repo_type="dataset", private=True, exist_ok=True)
          api.create_repo(sp, repo_type="space", space_sdk="docker", private=False, exist_ok=True)
          host = getattr(api.space_info(sp), "host", None) or f"https://{sp.lower().replace('/', '-').replace('_', '-')}.hf.space"
          # purane server se khoje gaye shabdon ki ginti (restart se pehle; sirf shabd + ginti)
          key = hashlib.sha256(token.encode()).hexdigest()[:32]
          path = "databranch/state/search_terms.json"
          old = Counter(json.load(open(path))) if os.path.exists(path) else Counter()
          try:
              with urllib.request.urlopen(f"{host}/stats?key={key}", timeout=30) as r:
                  old.update(json.load(r))
          except Exception as err:  # noqa: BLE001
              print("stats nahi mile:", err)
          os.makedirs("databranch/state", exist_ok=True)
          json.dump(dict(old.most_common(2000)), open(path, "w"), ensure_ascii=False, indent=0)
          if os.environ.get("SEND_DB") == "true":
              print("database bhej rahe hain:", ds)
              api.upload_file(path_or_fileobj=os.environ["GZ"], path_in_repo="krishivlaw.db.gz", repo_id=ds,
                              repo_type="dataset", commit_message="database update")
          api.add_space_secret(sp, "HF_TOKEN", token)
          api.add_space_variable(sp, "DB_REPO", ds)
          api.add_space_variable(sp, "ORIGINS", "https://nyay-sahayak-jn1t.onrender.com")
          api.upload_folder(folder_path="space", repo_id=sp, repo_type="space", commit_message="server update")
          api.restart_space(sp)   # naya database / code
          open("databranch/state/search_url", "w").write(host + "\n")
          print("Search server:", host)
          PY
      - name: Server jaaga? (database khulne mein kuch minute)
        run: |
          U=$(cat databranch/state/search_url)
          for i in $(seq 1 40); do
            r=$(curl -s --max-time 20 "$U/health" || true); echo "$r"
            echo "$r" | grep -q '"ready": true' && break; sleep 30
          done
      - name: Data branch par save
        run: |
          cd databranch
          git add state/search_url state/search_terms.json
          if git diff --cached --quiet; then echo "Kuch naya nahi"; exit 0; fi
          git commit -qm "search server $(TZ=Asia/Kolkata date '+%d-%m-%Y %H:%M')"
          for i in 1 2 3; do git push -q origin data && exit 0; sleep 5; git pull -q --rebase -X theirs origin data; done
          exit 1
      - name: App site update   # app ko search ka link mile
        run: sh scripts/publish_site.sh databranch
